name: Refresh soccer data

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-soccer-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify configuration
        run: |
          if [ -z "$FOOTBALL_DATA_TOKEN" ]; then
            echo "::error::Add the FOOTBALL_DATA_TOKEN repository secret."
            exit 1
          fi

      - name: Refresh and validate soccer data
        run: python3 projects/soccer/scripts/update_soccer.py

      - name: Commit verified changes
        run: |
          if git diff --quiet -- projects/soccer/data/soccer.json; then
            echo "Soccer data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/soccer/data/soccer.json
          git commit -m "Automatically refresh soccer data"
          git push
