name: College Scorecard Top 100 Import

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/college-scorecard-seed.yml
      - projects/college-statistics/config/scorecard_seed_universities.json
      - projects/college-statistics/scripts/select_top100.py
      - projects/college-statistics/scripts/scorecard_import.py
      - projects/college-statistics/scripts/validate_import.py
      - projects/college-statistics/scripts/scorecard_program_import.py
      - projects/college-statistics/scripts/validate_program_import.py
      - projects/college-statistics/scripts/summarize_program_import.py
      - projects/college-statistics/scripts/promote_bachelors.py

permissions:
  contents: write

concurrency:
  group: college-scorecard-top100-main
  cancel-in-progress: false

jobs:
  import-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/college-statistics

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Choose snapshot date
        id: snapshot
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Select 100-university coverage set
        env:
          COLLEGE_SCORECARD_API_KEY: ${{ secrets.COLLEGE_SCORECARD_API_KEY || 'DEMO_KEY' }}
        run: python3 scripts/select_top100.py --snapshot "${{ steps.snapshot.outputs.date }}" --target 100

      - name: Import institution data
        env:
          COLLEGE_SCORECARD_API_KEY: ${{ secrets.COLLEGE_SCORECARD_API_KEY || 'DEMO_KEY' }}
        run: >-
          python3 scripts/scorecard_import.py
          --seed "data/imported/college-scorecard-selection/${{ steps.snapshot.outputs.date }}/universities.json"
          --snapshot "${{ steps.snapshot.outputs.date }}"

      - name: Validate institution snapshot
        run: python3 scripts/validate_import.py "data/imported/college-scorecard/${{ steps.snapshot.outputs.date }}"

      - name: Import field-of-study data
        env:
          COLLEGE_SCORECARD_API_KEY: ${{ secrets.COLLEGE_SCORECARD_API_KEY || 'DEMO_KEY' }}
        run: >-
          python3 scripts/scorecard_program_import.py
          --seed "data/imported/college-scorecard-selection/${{ steps.snapshot.outputs.date }}/universities.json"
          --snapshot "${{ steps.snapshot.outputs.date }}"

      - name: Validate field-of-study snapshot
        run: python3 scripts/validate_program_import.py "data/imported/college-scorecard-programs/${{ steps.snapshot.outputs.date }}"

      - name: Summarize field-of-study snapshot
        run: python3 scripts/summarize_program_import.py "data/imported/college-scorecard-programs/${{ steps.snapshot.outputs.date }}"

      - name: Promote bachelor's data to website
        run: python3 scripts/promote_bachelors.py "${{ steps.snapshot.outputs.date }}"

      - name: Commit compact audit and website data
        shell: bash
        run: |
          SNAPSHOT="${{ steps.snapshot.outputs.date }}"
          PROGRAM_DIR="data/imported/college-scorecard-programs/$SNAPSHOT"
          SUMMARY_DIR="data/imported/college-scorecard-programs-summary/$SNAPSHOT"

          mkdir -p "$SUMMARY_DIR"
          cp "$PROGRAM_DIR/audit.json" "$SUMMARY_DIR/audit.json"
          cp "$PROGRAM_DIR/manifest.json" "$SUMMARY_DIR/manifest.json"

          # Full program staging is temporary at Top-100 scale; keep only compact audit metadata.
          git rm -rf --ignore-unmatch "$PROGRAM_DIR"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/imported/college-scorecard-selection/$SNAPSHOT"
          git add "data/imported/college-scorecard/$SNAPSHOT"
          git add "$SUMMARY_DIR"
          git add data/universities.json data/majors.json data/university-major.json
          git add data/salaries.json data/tuition.json data/admissions.json data/metadata.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Publish College Scorecard Top 100 coverage $SNAPSHOT"
          git push origin HEAD:main
