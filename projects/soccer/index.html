<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Completed European soccer results, calculated standings and dated player-leader snapshots." />
  <title>Soccer Dashboard | HelloCodex</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Soccer Dashboard</div>
      <h1>Your weekend soccer snapshot.</h1>
      <p class="lead">Completed results, calculated standings and dated player-leader snapshots across England, Spain, Italy, Germany and France.</p>
      <div class="notice">
        <strong>Data status:</strong>
        <span id="dataStatus">loading…</span>
      </div>
      <nav id="leagueTabs" class="league-tabs" aria-label="Leagues"></nav>
    </header>

    <main id="dashboard" class="grid">
      <section id="results" class="card wide" aria-live="polite"></section>
      <section id="standings" class="card wide"></section>
      <section id="scorers" class="card"></section>
      <section id="assists" class="card"></section>
    </main>

    <footer class="footer">
      <a href="../../">HelloCodex home</a> · Built from an iPhone using ChatGPT · Hosted on GitHub Pages
    </footer>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
