<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="European soccer results, standings, scorers and assists." />
  <title>European Soccer Hub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">European Soccer Hub</div>
      <h1>Your weekend soccer snapshot.</h1>
      <p class="lead">Results, league tables, top scorers and assist leaders across England, Spain, Italy, Germany and France — all in one lightweight site.</p>
      <div class="notice"><strong>Latest update:</strong> <span id="dataStatus">loading…</span></div>
      <nav id="leagueTabs" class="league-tabs" aria-label="Leagues"></nav>
    </header>

    <main class="grid">
      <section id="results" class="card wide" aria-live="polite"></section>
      <section id="standings" class="card wide"></section>
      <section id="scorers" class="card"></section>
      <section id="assists" class="card"></section>
    </main>

    <footer class="footer">Built from an iPhone using ChatGPT · Hosted on GitHub Pages</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
