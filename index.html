<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Codex</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f4f7fb, #e8eef8);
      color: #172033;
    }

    .card {
      width: min(90%, 620px);
      padding: 3.5rem 2.5rem;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(23, 32, 51, 0.08);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(23, 32, 51, 0.12);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.7;
      color: #5b6578;
    }

    .badge {
      display: inline-block;
      margin-bottom: 1.25rem;
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      background: #172033;
      color: white;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Hello World</div>
    <h1>Hello Codex</h1>
    <p>Built from my iPhone using ChatGPT.</p>
  </main>
</body>
</html>
